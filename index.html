<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>birds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/jpeg"
      sizes="32x32"
      href="images/me-favicon.png"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="nav-container">
        <a class="brand" href="index.html">forget me lot birding</a>
        <nav class="site-nav" aria-label="Main navigation">
          <ul class="nav-list">
            <li><a href="me.html">about me</a></li>
            <li><a href="index.html" class="lucky">surprise bird!</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <h1 class="site-title">forgetmelot's world avifauna records</h1>
      <section
        class="search-section"
        aria-label="search birds by species name or scientific name"
      >
        <div class="search-container">
          <label for="bird-search" class="sr-only">Search bird pages</label>
          <input
            id="bird-search"
            class="search-input"
            type="search"
            placeholder="search by species or scientific name (e.g. heron, Ardea)"
            autocomplete="off"
            aria-describedby="search-help"
          />
          <p id="search-help" class="search-help sr-only">
            Search by species name, scientific name, or other common names.
          </p>
        </div>
        <div
          id="search-results"
          class="search-results"
          aria-live="polite"
          aria-relevant="additions removals"
        ></div>
      </section>
      <section
        id="bird-catalog"
        class="order-section"
        aria-label="Bird taxonomy sections"
      ></section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
