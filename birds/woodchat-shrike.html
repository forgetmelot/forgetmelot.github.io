<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Woodchat Shrike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/me-favicon.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="species-page species-page--tight">
      <article class="species-hero blog-style">
        <div class="species-info">
          <h1>Woodchat Shrike</h1>
          <h2 class="latin">Lanius senator</h2>

          <div class="species-media">
            <img src="../images/woodchat-shrike-1.jpg" />
          </div>
          <p class="lead">
            A black-masked shrike with a rufous crown and nape.
          </p>

          <div class="species-media">
            <img src="../images/woodchat-shrike-2.jpg" />
          </div>
          <p class="lead">Juvenile is brown or grey and scaly-looking.</p>

          <div class="ratings">
            <div class="location-line">
              <span class="material-symbols-outlined" aria-hidden="true"
                >location_on</span
              >
              Morocco
            </div>

            <div
              class="rating rating-row"
              aria-label="Difficulty to photograph: 3 out of 5"
            >
              <div class="rating-label">Difficulty to photograph</div>
              <div class="stars" aria-hidden="true">
                <span class="star filled">★</span>
                <span class="star filled">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
              </div>
              <div class="note-box">
                Often perched on the top of trees or makes loud shrieking calls.
              </div>
            </div>
          </div>
        </div>
      </article>
    </main>

    <script src="../js/script.js"></script>
  </body>
</html>
