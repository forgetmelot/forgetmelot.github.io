<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurasian Jay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on" />
    <link rel="icon" type="image/png" sizes="32x32" href="../images/me-favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="species-page">
      <article class="species-hero blog-style">
        <div class="species-info">
          <h1>Eurasian Jay</h1>
          <h2 class="latin">Garrulus glandarius</h2>
          <p class="taxonomy">Order: Passeriformes</p>
          <p class="taxonomy">Family: Corvidae</p>

          <div class="species-media">
            <img src="../images/eurasian-jay.jpg">
          </div>

          <p class="lead">
            A peachy brown bird with a blue patch on the wing, black malar stripe, and light-coloured irises.
          </p>

          <div class="ratings">
            <div class="location-line"><span class="material-symbols-outlined" aria-hidden="true">location_on</span> UK</div>

            <div class="rating rating-row" aria-label="Difficulty to photograph: 3 out of 5">
              <div class="rating-label">Difficulty to photograph</div>
              <div class="stars" aria-hidden="true">
                <span class="star filled">★</span>
                <span class="star filled">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
              </div>
              <div class="note-box">
                A bit more cautious of humans than other crows.
              </div>
            </div>
          </div>

        </div>
      </article>
              
      <p class="back-link-container"><a class="back-link" href="../index.html">← Back to birds</a></p>
    </main>

  <script src="../js/script.js"></script>
</body>
</html>
