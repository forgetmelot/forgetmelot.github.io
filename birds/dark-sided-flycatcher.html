          <h2 class="latin">Muscicapa sibirica</h2>

          <div class="species-media">
            <img src="../images/dark-sided-flycatcher-1.jpg" />
          </div>
          <p class="lead">
            Dark grey-brown flycatcher with a dainty dark bill. Underparts are
            pale with a dark haze.
          </p>

          <div class="species-media">
            <img src="../images/dark-sided-flycatcher-2.jpg" />
          </div>
          <p class="lead">Has a whitish eye ring.</p>

              <div class="rating-label">Difficulty to photograph</div>

              <div class="note-box">Silent.</div>
            </div>
          </div>

      <div class="blog-content">
