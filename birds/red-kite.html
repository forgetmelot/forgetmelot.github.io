<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Kite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/me-favicon.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="species-page species-page--tight">
      <article class="species-hero blog-style">
        <div class="species-info">
          <h1>Red Kite</h1>
          <h2 class="latin">Milvus milvus</h2>
          <p class="taxonomy">Order: Accipitriformes</p>
          <p class="taxonomy">Family: Accipitridae</p>

          <div class="species-media">
            <img src="../images/red-kite-1.jpg" />
          </div>
          <p class="lead">
            A large raptor with a reddish-brown body and forked tail. Often
            found soaring; feeds on carrion.
          </p>

          <div class="ratings">
            <div class="location-line">
              <span class="material-symbols-outlined" aria-hidden="true"
                >location_on</span
              >
              UK
            </div>

            <div class="rating rating-row">
              <div class="rating-label">Difficulty to photograph</div>
              <div class="stars" data-rating="2"></div>
              <div class="note-box">
                Slow, but requires some luck to get a close encounter.
              </div>
            </div>
          </div>
        </div>
      </article>
    </main>

    <script src="../js/script.js"></script>
  </body>
</html>
