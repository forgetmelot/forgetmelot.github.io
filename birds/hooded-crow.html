<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hooded Crow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/me-favicon.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="species-page">
      <article class="species-hero blog-style">
        <div class="species-info">
          <h1>Hooded Crow</h1>
          <h2 class="latin">Corvus cornix</h2>
          <p class="taxonomy">Order: Passeriformes</p>
          <p class="taxonomy">Family: Corvidae</p>

          <div class="species-media">
            <img src="../images/hooded-crow.jpg" />
          </div>

          <p class="lead">
            A large crow with a grey body and black head, wings and tail.
          </p>

          <div class="ratings">
            <div class="location-line">
              <span class="material-symbols-outlined" aria-hidden="true"
                >location_on</span
              >
              Europe
            </div>

            <div class="rating rating-row">
              <div class="rating-label">Difficulty to photograph</div>
              <div class="stars" data-rating="1"></div>
              <div class="note-box">Conspicuous, slow and chill.</div>
            </div>
          </div>
        </div>
      </article>

      <div class="blog-content">
        <section class="species-section">
          <h3>Sounds</h3>
          <p>
            <em>AAAH! AAAH!</em>
          </p>
        </section>
      </div>
    </main>

    <script src="../js/script.js"></script>
  </body>
</html>
