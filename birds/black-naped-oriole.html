<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black-naped Oriole</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/me-favicon.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="species-page species-page--tight">
      <article class="species-hero blog-style">
        <div class="species-info">
          <h1>Black-naped Oriole</h1>
          <h2 class="latin">Oriolus chinensis</h2>
          <p class="taxonomy">Order: Passeriformes</p>
          <p class="taxonomy">Family: Oriolidae</p>

          <div class="species-media">
            <img src="../images/black-naped-oriole-1.jpg" />
          </div>
          <p class="lead">
            A large, yellow bird with a pink bill, black mask and black wings.
            Female and juvenile are more greenish; they have some black in the
            bill and a fainter black mask.
          </p>

          <div class="ratings">
            <div class="location-line">
              <span class="material-symbols-outlined" aria-hidden="true"
                >location_on</span
              >
              HK
            </div>

            <div class="rating rating-row" data-tags="Skulky">
              <div class="rating-label">Difficulty to photograph</div>
              <div class="stars" data-rating="5"></div>
            </div>
          </div>
        </div>
      </article>
    </main>

    <script src="../js/script.js"></script>
  </body>
</html>
